name: Build and Deploy Server

# The repository root is the server. Do not filter on splendor-server/** —
# that path never matches, so pushes to main would not deploy.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image and save as tar
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: splendor-server-image:latest
          outputs: type=docker,dest=image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-docker-image
          path: image.tar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: server-docker-image

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Trim accidental whitespace. Do not print the host.
          SERVER_IP=$(printf '%s' "$SERVER_IP" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$SERVER_IP" ]; then
            echo "SERVER_IP secret is empty."
            exit 1
          fi
          echo "SERVER_IP length=${#SERVER_IP}"
          if timeout 15 bash -c 'echo >/dev/tcp/$1/22' _ "$SERVER_IP"; then
            echo "tcp/22 reachable"
          else
            echo "tcp/22 check failed (exit $?)"
          fi
          # ssh-keyscan exits 1 when any default key type is missing, even if other
          # keys were written. bash -e would fail the step before scp.
          scan_err=$(mktemp)
          ssh-keyscan -T 20 -t ed25519,ecdsa,rsa -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>"$scan_err" || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            ssh-keyscan -4 -T 20 -t ed25519,ecdsa,rsa -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>>"$scan_err" || true
          fi
          while IFS= read -r line || [ -n "$line" ]; do
            printf '%s\n' "${line//$SERVER_IP/[server]}"
          done < "$scan_err"
          rm -f "$scan_err"
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ssh-keyscan collected no host keys. VPS port 22 is not answering GitHub Actions, or SERVER_IP is wrong."
            exit 1
          fi
          echo "known_hosts lines: $(wc -l < ~/.ssh/known_hosts)"

      - name: Copy image to server
        run: scp image.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/root/splendor-server/

      - name: Record whether OpenRouter secret is available
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "GitHub Actions secret OPENROUTER_API_KEY is set."
            echo "Deploy will write AI_ENGINE=jev and the key to /root/splendor-server/.env (value not printed)."
          else
            echo "GitHub Actions secret OPENROUTER_API_KEY is NOT set."
            echo "Deploy will not invent a key and will not change AI_ENGINE."
            echo "POST-DEPLOY: on the VPS, edit /root/splendor-server/.env and set:"
            echo "  AI_ENGINE=jev"
            echo "  OPENROUTER_API_KEY=<OpenRouter API key>"
            echo "Then: cd /root/splendor-server && docker-compose up -d --force-recreate"
            echo "Until then the compose default remains AI_ENGINE=heuristic when unset."
          fi

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: OPENROUTER_API_KEY
          script: |
            cd /root/splendor-server
            mkdir -p logs
            docker-compose logs > logs/backup-$(date +%Y%m%d-%H%M%S).log || true
            find logs -name "backup-*.log" -mtime +7 -delete

            touch .env
            chmod 600 .env
            upsert_env() {
              key="$1"
              value="$2"
              tmp=$(mktemp)
              grep -v "^${key}=" .env > "$tmp" || true
              case "$value" in
                *[!A-Za-z0-9._:+/-]*)
                  escaped=$(printf '%s' "$value" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/\$/\\$/g' -e 's/`/\\`/g')
                  printf '%s="%s"\n' "$key" "$escaped" >> "$tmp"
                  ;;
                *)
                  printf '%s=%s\n' "$key" "$value" >> "$tmp"
                  ;;
              esac
              mv "$tmp" .env
              chmod 600 .env
            }

            if [ -n "${OPENROUTER_API_KEY:-}" ]; then
              upsert_env AI_ENGINE jev
              upsert_env OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
              echo "Wrote AI_ENGINE=jev and OPENROUTER_API_KEY into /root/splendor-server/.env (key value not printed)."
            else
              echo "OPENROUTER_API_KEY GitHub Actions secret is not set. Not inventing a key and not changing AI_ENGINE."
              echo "POST-DEPLOY: on the VPS, edit /root/splendor-server/.env and set:"
              echo "  AI_ENGINE=jev"
              echo "  OPENROUTER_API_KEY=<OpenRouter API key>"
              echo "Then: cd /root/splendor-server && docker-compose up -d --force-recreate"
              echo "Compose default remains AI_ENGINE=heuristic when the variable is unset. The binary falls back to the heuristic if jev is selected without a key."
            fi

            if grep -q '^AI_ENGINE=' .env; then
              echo "JEV_ENV_STATUS AI_ENGINE=$(grep '^AI_ENGINE=' .env | tail -1 | cut -d= -f2-)"
            else
              echo "JEV_ENV_STATUS AI_ENGINE=unset (compose default heuristic)"
            fi
            if grep -qE '^OPENROUTER_API_KEY=.+' .env; then
              echo "JEV_ENV_STATUS OPENROUTER_API_KEY=set"
            else
              echo "JEV_ENV_STATUS OPENROUTER_API_KEY=missing"
            fi

            docker-compose down || true
            docker load < image.tar
            docker-compose up -d
            echo "Waiting for server service to start..."
            sleep 10
            if ! curl -s http://localhost:3001 > /dev/null; then
              echo "Server service is not responding!"
              docker-compose logs
              exit 1
            fi
            rm -f image.tar
            docker system prune -f --volumes
            echo "✅ Server deployment completed successfully!"
