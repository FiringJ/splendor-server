# fly.toml app configuration file generated for splendor-server on 2026-09-20T14:22:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'splendor-server'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  HOST = '0.0.0.0'
  # Optional: comma-separated extra browser origins (in addition to defaults + *.fly.dev).
  # Prefer: fly secrets set CLIENT_ORIGIN=https://your-client.fly.dev
  # CLIENT_ORIGIN = 'https://your-client.fly.dev'

[http_service]
  internal_port = 3001
  force_https = true
  # In-memory game rooms: do not auto-stop; keep at least one machine.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  checks = [{ grace_period = '20s', interval = '15s', method = 'GET', path = '/health', timeout = '2s' }]

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
