# Fly.io app config for the NestJS + Socket.IO Splendor server.
# Suggested app name: splendor-server (or firingj-splendor-server if taken).
#
# Rooms are in-memory — keep a single machine (see min_machines_running / scale).
# WebSockets / Socket.IO work via the HTTP service (upgrade supported by default).

app = 'splendor-server'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  HOST = '0.0.0.0'
  # Optional: comma-separated extra browser origins (in addition to defaults + *.fly.dev).
  # Prefer: fly secrets set CLIENT_ORIGIN=https://your-client.fly.dev
  # CLIENT_ORIGIN = 'https://your-client.fly.dev'

[http_service]
  internal_port = 3001
  force_https = true
  # In-memory game rooms: do not auto-stop; keep at least one machine.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
