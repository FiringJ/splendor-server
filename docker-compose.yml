services:
  server:
    image: splendor-server-image:latest
    container_name: splendor-server-server-1
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - AI_ENGINE=${AI_ENGINE:-heuristic}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    restart: unless-stopped
